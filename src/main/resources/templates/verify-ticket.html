<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Ticket Verification - CinePass')}"></head>
<body class="d-flex flex-column min-vh-100 justify-content-between" th:with="focusNav=true">

    <!-- Shared Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4 py-lg-5">
        <div class="container-xl" style="max-width: 640px;">

            <!-- Valid reference -->
            <article th:if="${valid}" class="ticket-card" th:with="st=${reservation.status.name()}">
                <div class="p-4 text-center border-bottom"
                     th:classappend="${st == 'CONFIRMED' ? 'bg-success-subtle' : (st == 'PENDING' ? 'bg-warning-subtle' : 'bg-body-tertiary')}">
                    <div class="fw-bold fs-5"
                         th:classappend="${st == 'CONFIRMED' ? 'text-success' : (st == 'PENDING' ? 'text-warning-emphasis' : 'text-body-secondary')}"
                         th:text="${st == 'CONFIRMED' ? 'Valid ticket' : (st == 'PENDING' ? 'Payment pending: not valid for entry' : (st == 'CANCELLED' ? 'Cancelled: not valid for entry' : 'Expired: not valid for entry'))}">Valid ticket</div>
                    <div class="font-monospace fw-semibold mt-1" th:text="${reservation.bookingReference}">CP-8392AB</div>
                </div>

                <div class="p-4">
                    <div class="d-flex gap-3 mb-4">
                        <img th:src="${reservation.showtime.movie.posterUrl}" th:alt="${reservation.showtime.movie.title} + ' poster'"
                             class="rounded-2 flex-shrink-0" style="width: 72px; aspect-ratio: 2/3; object-fit: cover;">
                        <div>
                            <h1 class="fs-5 mb-1" th:text="${reservation.showtime.movie.title}">Movie title</h1>
                            <div class="text-body-secondary small" th:text="${reservation.showtime.screen.theater.name} + ', ' + ${reservation.showtime.screen.theater.city} + ' · Screen ' + ${reservation.showtime.screen.screenNumber}">Theater, City · Screen 1</div>
                        </div>
                    </div>

                    <div class="row g-3 small">
                        <div class="col-6">
                            <div class="text-body-secondary">Show</div>
                            <div class="fw-semibold" th:text="${#temporals.format(reservation.showtime.startTime, 'EEE, dd MMM yyyy · hh:mm a')}">Wed, 25 Nov 2026 · 08:30 PM</div>
                        </div>
                        <div class="col-6">
                            <div class="text-body-secondary">Seats</div>
                            <div class="fw-semibold" th:text="${reservation.seatSummary}">A1, A2</div>
                        </div>
                        <div class="col-6">
                            <div class="text-body-secondary">Booked by</div>
                            <div class="fw-semibold" th:text="${guestName}">Rahul S.</div>
                        </div>
                        <div class="col-6">
                            <div class="text-body-secondary">Amount</div>
                            <div class="fw-semibold" th:text="'₹' + ${#numbers.formatDecimal(reservation.totalAmount, 1, 'COMMA', 2, 'POINT')}">₹750.00</div>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                        <span class="text-body-secondary small" th:text="'Checked ' + ${#temporals.format(verifiedAt, 'dd MMM yyyy, hh:mm a')}">Checked now</span>
                        <!-- Only the ticket holder or an admin may pull the PDF; door staff just need the status above -->
                        <th:block sec:authorize="isAuthenticated()">
                        <a th:if="${st == 'CONFIRMED' and (#authorization.expression('hasRole(''ADMIN'')') or #authentication.principal.id == reservation.user.id)}" th:href="@{'/reservations/' + ${reservation.id} + '/ticket'}" class="btn btn-outline-custom btn-sm">Download ticket (PDF)</a>
                        </th:block>
                    </div>
                </div>
            </article>

            <!-- Unknown reference -->
            <div th:unless="${valid}" class="theater-card text-center py-5">
                <h1 class="fs-4 mb-2">Ticket not found</h1>
                <p class="text-body-secondary mb-4">
                    No booking matches <span class="font-monospace fw-semibold text-body" th:text="${bookingReference}">INVALID-REF</span>.
                    Scan the QR code from your ticket PDF or confirmation email.
                </p>
                <a th:href="@{/}" class="btn btn-accent px-4">Go to home</a>
            </div>

        </div>
    </main>

    <!-- Shared Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
