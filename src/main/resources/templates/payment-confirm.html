<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Review & Pay - CinePass')}"></head>
<body class="d-flex flex-column min-vh-100">

    <!-- Shared Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container px-lg-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    
                    <!-- Top Breadcrumb / Progress Bar with Expiry Countdown -->
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <a th:href="@{'/showtimes/' + ${reservation.showtime.id} + '/seats'}" class="btn btn-sm btn-outline-custom">
                            <i class="fa-solid fa-arrow-left me-1"></i> Change Seats
                        </a>
                        <div id="holdTimerBadge" class="badge bg-warning-subtle text-warning border border-warning px-3 py-2 fw-semibold d-flex align-items-center gap-2"
                             th:data-created-at="${#temporals.format(reservation.createdAt, 'yyyy-MM-dd''T''HH:mm:ss')}">
                            <i class="fa-solid fa-stopwatch text-danger fs-6"></i>
                            <span>Seat Hold Expires: <span id="holdCountdown" class="font-monospace fw-bold text-white fs-6">10:00</span></span>
                        </div>
                    </div>

                    <!-- Main Confirmation Card -->
                    <div class="card bg-surface border-subtle shadow-lg rounded-4 overflow-hidden">
                        <!-- Card Header -->
                        <div class="p-4 border-bottom border-subtle d-flex flex-wrap align-items-center justify-content-between gap-3" style="background: rgba(20, 20, 30, 0.6);">
                            <div>
                                <span class="text-secondary-subtle small text-uppercase tracking-wider">Booking Order</span>
                                <h3 class="fw-bold text-white mb-0" th:text="${reservation.bookingReference}">BMS-928410</h3>
                            </div>
                            <span class="badge bg-danger-subtle text-danger border border-danger px-3 py-2 fw-bold" th:text="${reservation.status}">PENDING</span>
                        </div>

                        <!-- Card Body -->
                        <div class="card-body p-4 p-md-5">
                            <div class="row g-4 mb-4">
                                <!-- Movie Poster Thumbnail -->
                                <div class="col-sm-3 text-center text-sm-start">
                                    <img th:src="${reservation.showtime.movie.posterUrl}" th:alt="${reservation.showtime.movie.title}" class="rounded-3 shadow" style="width: 100%; max-width: 140px; aspect-ratio: 2/3; object-fit: cover;"
                                         onerror="this.src='https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop'">
                                </div>

                                <!-- Cinema & Showtime Details -->
                                <div class="col-sm-9">
                                    <h4 class="fw-bold text-white mb-1" th:text="${reservation.showtime.movie.title}">Dune: Part Two</h4>
                                    <div class="text-secondary-subtle mb-3">
                                        <i class="fa-solid fa-location-dot text-accent me-1"></i>
                                        <span th:text="${reservation.showtime.screen.theater.name} + ' (' + ${reservation.showtime.screen.theater.city} + ')'">PVR ICON, Mumbai</span>
                                        <span class="badge bg-secondary ms-2" th:text="'Screen ' + ${reservation.showtime.screen.screenNumber}">Screen 1</span>
                                    </div>

                                    <div class="p-3 rounded-3 mb-3" style="background: var(--bg-body); border: 1px solid var(--border-subtle);">
                                        <div class="d-flex align-items-center gap-2 text-white fw-semibold mb-1">
                                            <i class="fa-regular fa-calendar-check text-accent"></i>
                                            <span th:text="${#temporals.format(reservation.showtime.startTime, 'EEEE, dd MMMM yyyy - hh:mm a')}">Showtime Date & Time</span>
                                        </div>
                                        <div class="text-secondary-subtle small">
                                            Booked for: <strong class="text-white" th:text="${reservation.user.name}">User</strong> (<span th:text="${reservation.user.email}">email</span>)
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Selected Seats Breakdown -->
                            <div class="mb-4">
                                <h5 class="fw-bold text-white mb-3">
                                    <i class="fa-solid fa-couch text-accent me-2"></i> Reserved Seats (<span th:text="${reservation.reservationSeats.size()}">1</span>)
                                </h5>
                                <div class="table-responsive">
                                    <table class="table table-dark table-borderless align-middle mb-0" style="background: var(--bg-body); border-radius: 8px;">
                                        <thead class="text-secondary-subtle small border-bottom border-secondary">
                                            <tr>
                                                <th scope="col" class="ps-3">Seat</th>
                                                <th scope="col">Tier</th>
                                                <th scope="col" class="text-end pe-3">Price</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="rs : ${reservation.reservationSeats}">
                                                <td class="ps-3 fw-bold text-white">
                                                    <span class="badge bg-danger-subtle text-danger border border-danger me-2" th:text="${rs.seat.seatRow + rs.seat.seatNumber}">A1</span>
                                                </td>
                                                <td>
                                                    <span class="badge bg-secondary-subtle text-white border border-subtle" th:text="${rs.seat.seatType}">RECLINER</span>
                                                </td>
                                                <td class="text-end pe-3 fw-semibold text-white" th:text="'₹' + ${rs.priceAtBooking}">₹450.00</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- Total Amount & Payment Action -->
                            <div class="p-4 rounded-3 d-flex flex-wrap align-items-center justify-content-between gap-3" style="background: rgba(225, 54, 86, 0.08); border: 1px solid rgba(225, 54, 86, 0.3);">
                                <div>
                                    <div class="text-secondary-subtle small">Grand Total (Inclusive of all taxes)</div>
                                    <div class="display-6 fw-bold text-white" th:text="'₹' + ${reservation.totalAmount}">₹450.00</div>
                                </div>

                                <div class="d-flex align-items-center gap-3">
                                    <!-- Cancel & Release Seats -->
                                    <form th:action="@{'/reservations/' + ${reservation.id} + '/cancel'}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-outline-custom px-3 py-2" onclick="return confirm('Are you sure you want to cancel this reservation and release your seats?')">
                                            <i class="fa-solid fa-xmark me-1"></i> Cancel
                                        </button>
                                    </form>

                                    <!-- Pay & Confirm -->
                                    <form id="payConfirmForm" th:action="@{'/reservations/' + ${reservation.id} + '/confirm'}" method="post" class="m-0">
                                        <button type="submit" id="payConfirmBtn" class="btn btn-accent btn-lg px-4 py-2 fw-bold shadow">
                                            <i class="fa-solid fa-credit-card me-2"></i> Pay & Confirm Now
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Shared Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
