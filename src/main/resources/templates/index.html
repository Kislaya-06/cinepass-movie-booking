<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('CinePass - Book Movie Tickets Online')}"></head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container-xl">

            <!-- Featured film -->
            <section class="hero-banner mb-4" th:if="${featuredMovie != null}">
                <div class="hero-backdrop" th:style="'background-image: url(' + ${featuredMovie.posterUrl} + ');'"></div>
                <div class="hero-content">
                    <span class="hero-badge">Featured</span>
                    <h1 class="display-6 mb-2" th:text="${featuredMovie.title}">Movie title</h1>
                    <p class="text-body-secondary small mb-3">
                        <span th:text="${featuredMovie.language}">English</span>
                        <span th:if="${featuredMovie.durationInMinutes != null}" th:text="' · ' + ${featuredMovie.durationInMinutes / 60} + 'h ' + ${featuredMovie.durationInMinutes % 60} + 'm'"> · 2h 30m</span>
                        <span th:text="' · ' + ${featuredMovie.genre}"> · Genre</span>
                        <span th:if="${featuredMovie.rating != null}" th:text="' · ★ ' + ${#numbers.formatDecimal(featuredMovie.rating, 1, 1)} + '/10'"> · ★ 8.0/10</span>
                    </p>
                    <div class="d-none d-md-block mb-4"><p class="text-body-secondary mb-0" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;" th:text="${featuredMovie.description}">Description</p></div>
                    <a th:href="@{'/movies/' + ${featuredMovie.id}}" class="btn btn-accent px-4">Book tickets</a>
                </div>
            </section>

            <!-- Genre filter -->
            <nav class="filter-pills-row mb-4" aria-label="Filter by genre">
                <a th:href="@{/}" class="filter-pill" th:classappend="${activeGenre == 'all' ? 'active' : ''}">All</a>
                <a th:each="g : ${ {'Action','Sci-Fi','Drama','Comedy','Thriller','Adventure','Animation'} }"
                   th:href="@{/(genre=${g})}" class="filter-pill" th:classappend="${activeGenre == g ? 'active' : ''}" th:text="${g}">Genre</a>
            </nav>

            <th:block th:with="collapsed=${param.all == null and param.search == null and activeGenre == 'all' and nowShowing.size() > 10}">
            <!-- Now showing -->
            <section class="mb-5">
                <div class="section-header">
                    <h2 class="section-title" th:text="${param.search != null ? 'Results for &quot;' + param.search[0] + '&quot;' : 'Now showing'}">Now showing</h2>
                    <a th:if="${collapsed}" th:href="@{/(all=true)}" class="small fw-semibold text-accent" th:text="'See all (' + ${nowShowing.size()} + ') ›'">See all ›</a>
                    <span th:unless="${collapsed}" class="text-body-secondary small" th:text="${nowShowing.size()} + ' movies'">20 movies</span>
                </div>

                <p th:if="${nowShowing.isEmpty()}" class="text-body-secondary">No movies showing right now. Try another genre or search.</p>

                <div class="movie-grid" th:unless="${nowShowing.isEmpty()}">
                    <div class="movie-card" th:each="movie, it : ${nowShowing}" th:if="${!collapsed or it.index < 10}">
                        <a th:href="@{'/movies/' + ${movie.id}}">
                            <div class="movie-poster-wrap">
                                <img th:src="${movie.posterUrl}" th:alt="${movie.title} + ' poster'" class="movie-poster-img" loading="lazy"
                                     onerror="this.src='https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop'">
                                <div class="movie-rating-badge" th:if="${movie.rating != null}">
                                    <i class="fa-solid fa-star text-gold me-1" aria-hidden="true"></i><span th:text="${#numbers.formatDecimal(movie.rating, 1, 1)} + '/10'">8.0/10</span>
                                </div>
                            </div>
                            <div class="movie-card-body">
                                <div class="movie-title" th:text="${movie.title}" th:title="${movie.title}">Movie title</div>
                                <div class="movie-genres" th:text="${movie.genre}">Genre</div>
                            </div>
                        </a>
                    </div>
                </div>
            </section>

            </th:block>

            <!-- Coming soon -->
            <section class="mb-5" th:if="${comingSoon != null and !comingSoon.isEmpty()}">
                <div class="section-header">
                    <h2 class="section-title">Coming soon</h2>
                </div>
                <div class="movie-scroll-row">
                    <div class="movie-card" th:each="movie : ${comingSoon}">
                        <a th:href="@{'/movies/' + ${movie.id}}">
                            <div class="movie-poster-wrap">
                                <img th:src="${movie.posterUrl}" th:alt="${movie.title} + ' poster'" class="movie-poster-img" loading="lazy"
                                     onerror="this.src='https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=600&auto=format&fit=crop'">
                                <div class="movie-rating-badge" th:if="${movie.releaseDate != null}"
                                     th:text="'Releases ' + ${#temporals.format(movie.releaseDate, 'dd MMM')}">Releases 12 Dec</div>
                            </div>
                            <div class="movie-card-body">
                                <div class="movie-title" th:text="${movie.title}" th:title="${movie.title}">Movie title</div>
                                <div class="movie-genres" th:text="${movie.genre}">Genre</div>
                            </div>
                        </a>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
