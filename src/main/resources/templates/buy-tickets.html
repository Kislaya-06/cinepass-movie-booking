<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1">
        <!-- Film title and tags -->
        <section class="bg-surface border-bottom">
            <div class="container-xl pt-4 pb-3">
                <a th:href="@{'/movies/' + ${movie.id}}" class="small text-body-secondary"><i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i>About the movie</a>
                <h1 class="fs-3 mt-1 mb-2" th:text="${movie.title} + ' - (' + ${movie.language} + ')'">Movie - (English)</h1>
                <div class="d-flex flex-wrap gap-2">
                    <span class="tag-outline" th:if="${movie.durationInMinutes != null}" th:text="'Runtime ' + ${movie.durationInMinutes / 60} + 'h ' + ${movie.durationInMinutes % 60} + 'm'">Runtime 2h 30m</span>
                    <th:block th:if="${movie.genre != null}"><span class="tag-outline" th:each="g : ${#strings.arraySplit(movie.genre, ',')}" th:text="${#strings.trim(g)}">Action</span></th:block>
                </div>
            </div>

            <!-- Seven-day strip; days without shows are disabled -->
            <div class="container-xl">
                <nav class="date-strip mb-0 pb-3" aria-label="Pick a date">
                    <th:block th:each="d : ${days}">
                        <a th:if="${daysWithShows.contains(d)}" class="date-tab" th:classappend="${d == selectedDate ? 'active' : ''}"
                           th:href="@{'/movies/' + ${movie.id} + '/buytickets'(date=${d})}"
                           th:aria-current="${d == selectedDate ? 'date' : null}" th:aria-label="${#temporals.format(d, 'EEEE, dd MMMM')}">
                            <span class="dow" th:text="${#temporals.format(d, 'EEE')}">Wed</span>
                            <span class="day" th:text="${#temporals.format(d, 'dd')}">25</span>
                            <span class="mon" th:text="${#temporals.format(d, 'MMM')}">Nov</span>
                        </a>
                        <span th:unless="${daysWithShows.contains(d)}" class="date-tab disabled" aria-disabled="true" th:title="'No shows on ' + ${#temporals.format(d, 'dd MMM')}">
                            <span class="dow" th:text="${#temporals.format(d, 'EEE')}">Thu</span>
                            <span class="day" th:text="${#temporals.format(d, 'dd')}">26</span>
                            <span class="mon" th:text="${#temporals.format(d, 'MMM')}">Nov</span>
                        </span>
                    </th:block>
                </nav>
            </div>

            <!-- Time-of-day filter (client side) and legend -->
            <div class="border-top">
                <div class="container-xl d-flex flex-wrap align-items-center justify-content-between gap-2 py-2">
                    <div class="d-flex flex-wrap gap-2" role="group" aria-label="Filter by show time" id="timeFilter">
                        <button type="button" class="filter-pill active" data-slot="all">All shows</button>
                        <button type="button" class="filter-pill" data-slot="morning">Morning</button>
                        <button type="button" class="filter-pill" data-slot="afternoon">Afternoon</button>
                        <button type="button" class="filter-pill" data-slot="evening">Evening</button>
                        <button type="button" class="filter-pill" data-slot="night">Night</button>
                    </div>
                    <div class="d-flex gap-3 small text-body-secondary">
                        <span><span class="legend-dot bg-success"></span>Available</span>
                        <span><span class="legend-dot" style="background: var(--gold);"></span>Fast filling</span>
                    </div>
                </div>
            </div>
        </section>

        <div class="container-xl py-4">
            <div th:if="${theaters.isEmpty()}" class="theater-card text-center py-5">
                <h2 class="fs-5 mb-2">No shows in <span th:text="${selectedCity}">this city</span> on this day</h2>
                <p class="text-body-secondary mb-3">Pick another date or city.</p>
                <button type="button" class="btn btn-accent btn-sm" data-bs-toggle="modal" data-bs-target="#citySelectModal">Change city</button>
            </div>

            <p class="small text-body-secondary mb-3" th:unless="${theaters.isEmpty()}" th:text="'Cinemas in ' + ${selectedCity} + (${selectedArea != null and !selectedArea.isBlank()} ? ', nearest to ' + ${selectedArea} + ' first' : '')">Cinemas in Delhi-NCR</p>

            <div th:each="theaterEntry : ${theaters}" class="theater-card theater-row">
                <div class="theater-header">
                    <div>
                        <h2 class="fs-6 fw-bold mb-1" th:text="${theaterEntry.key}">Theater name</h2>
                        <div class="text-body-secondary small" th:text="${theaterEntry.value[0].screen.theater.location}">Location</div>
                    </div>
                </div>
                <div class="showtime-pills-wrap">
                    <a th:each="st : ${theaterEntry.value}" th:href="@{'/showtimes/' + ${st.id} + '/seats'}"
                       class="showtime-pill" th:classappend="${fastFilling.contains(st.id) ? 'filling' : ''}"
                       th:data-hour="${st.startTime.hour}"
                       th:title="'Screen ' + ${st.screen.screenNumber} + (${fastFilling.contains(st.id)} ? ' · Fast filling' : '')"
                       th:text="${#temporals.format(st.startTime, 'hh:mm a')}">10:15 AM</a>
                </div>
            </div>
            <p id="noSlotShows" class="text-body-secondary text-center py-4 d-none">No shows at this time of day. Try another filter.</p>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
