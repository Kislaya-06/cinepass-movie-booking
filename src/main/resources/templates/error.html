<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Error - CinePass')}"></head>
<body>

    <!-- Shared Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 auth-wrapper text-center">
        <div class="auth-card" style="max-width: 520px;">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-4 rounded-circle mb-3" style="background: rgba(225, 54, 86, 0.15); border: 1px solid rgba(225, 54, 86, 0.3);">
                    <i class="fa-solid fa-film text-accent display-4"></i>
                </div>
                <div class="display-3 fw-bold text-white mb-2" th:text="${errorCode ?: status ?: 404}">404</div>
                <h4 class="fw-bold text-white mb-2">Film Reel Interrupted</h4>
                <!-- errorCode/errorMessage come from GlobalExceptionHandler; Spring Security errors (403) only set status -->
                <p class="text-secondary-subtle" th:text="${errorMessage ?: (status == 403 ? 'You do not have permission to open this page. Admin pages need an admin account.' : 'Oops! The movie, theater, or showtime you are looking for has moved or does not exist.')}">
                    Oops! The movie, theater, or showtime you are looking for has moved or does not exist.
                </p>
            </div>

            <div class="d-flex flex-wrap justify-content-center gap-3">
                <a th:href="@{/}" class="btn btn-accent px-4 py-2">
                    <i class="fa-solid fa-house me-1"></i> Back to Home
                </a>
                <a th:href="@{/my-bookings}" class="btn btn-outline-custom px-4 py-2">
                    <i class="fa-solid fa-receipt me-1"></i> My Bookings
                </a>
            </div>
        </div>
    </main>

    <!-- Shared Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
