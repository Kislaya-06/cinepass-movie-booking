<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Error - CinePass'">Error - CinePass</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

    <!-- Shared Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 auth-wrapper text-center">
        <div class="auth-card" style="max-width: 520px;">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-4 rounded-circle mb-3" style="background: rgba(225, 54, 86, 0.15); border: 1px solid rgba(225, 54, 86, 0.3);">
                    <i class="fa-solid fa-film text-accent display-4"></i>
                </div>
                <div class="display-3 fw-bold text-white mb-2" th:text="${errorCode} ?: '404'">404</div>
                <h4 class="fw-bold text-white mb-2">Film Reel Interrupted</h4>
                <p class="text-secondary-subtle" th:text="${errorMessage} ?: 'Oops! The movie, theater, or showtime you are looking for has moved or does not exist.'">
                    Oops! The movie, theater, or showtime you are looking for has moved or does not exist.
                </p>
            </div>

            <div class="d-flex flex-wrap justify-content-center gap-3">
                <a th:href="@{/}" class="btn btn-accent px-4 py-2">
                    <i class="fa-solid fa-house me-1"></i> Back to Home
                </a>
                <a th:href="@{/my-bookings}" class="btn btn-outline-custom px-4 py-2">
                    <i class="fa-solid fa-receipt me-1"></i> My Bookings
                </a>
            </div>
        </div>
    </main>

    <!-- Shared Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom App JS -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
