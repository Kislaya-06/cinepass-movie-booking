<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Error - CinePass')}"></head>
<body>

    <!-- Shared Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 auth-wrapper text-center">
        <div class="auth-card" style="max-width: 520px;">
            <div class="mb-4">
                <div class="display-4 fw-bold text-accent mb-2" th:text="${errorCode ?: status ?: 404}">404</div>
                <h1 class="fs-4 mb-2" th:text="${status == 403 ? 'Access denied' : (status != null and status >= 500 ? 'Something went wrong' : 'Page not found')}">Page not found</h1>
                <!-- errorCode/errorMessage come from GlobalExceptionHandler; Spring Security errors (403) only set status -->
                <p class="text-body-secondary mb-0" th:text="${errorMessage ?: (status == 403 ? 'You do not have permission to open this page with this account.' : (status != null and status >= 500 ? 'Something broke on our side. Please try again in a moment.' : 'The movie, theater or showtime you are looking for has moved or does not exist.'))}">
                    The movie, theater or showtime you are looking for has moved or does not exist.
                </p>
            </div>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a th:href="@{/}" class="btn btn-accent px-4" sec:authorize="!hasRole('ADMIN')">Go to home</a>
                <a th:href="@{/my-bookings}" class="btn btn-outline-custom px-4" sec:authorize="hasRole('USER')">My bookings</a>
                <a th:href="@{/admin/dashboard}" class="btn btn-accent px-4" sec:authorize="hasRole('ADMIN')">Go to dashboard</a>
            </div>
        </div>
    </main>

    <!-- Shared Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
