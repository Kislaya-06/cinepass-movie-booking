<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="footer">
<footer class="bms-footer">
    <div class="container-xl">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-4">
            <div style="max-width: 360px;">
                <a th:href="@{/}" class="bms-brand mb-2">
                    <span class="logo-icon"><i class="fa-solid fa-ticket-simple" aria-hidden="true"></i></span>
                    <span><span class="text-accent">Cine</span>Pass</span>
                </a>
                <p class="mb-0">Book movie tickets, pick your seats and get a QR ticket in your inbox.</p>
            </div>
            <nav class="d-flex flex-wrap gap-4" aria-label="Footer">
                <a th:href="@{/}" sec:authorize="!hasRole('ADMIN')">Movies</a>
                <a th:href="@{/my-bookings}" sec:authorize="!hasRole('ADMIN')">My bookings</a>
                <a th:href="@{/login}" sec:authorize="isAnonymous()">Sign in</a>
                <a th:href="@{/register}" sec:authorize="isAnonymous()">Create account</a>
            </nav>
        </div>
        <hr class="my-4">
        <div class="small">&copy; 2026 CinePass</div>
    </div>
</footer>
<!-- Styled stand-in for window.confirm(); any <form data-confirm="Question?"> opens it (main.js) -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalText" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-surface border border-subtle text-body">
            <div class="modal-body p-4">
                <p id="confirmModalText" class="mb-0 fs-6">Are you sure?</p>
            </div>
            <div class="modal-footer border-top border-subtle">
                <button type="button" class="btn btn-outline-custom btn-sm" data-bs-dismiss="modal">No, go back</button>
                <button type="button" class="btn btn-danger btn-sm" id="confirmModalOk">Yes, continue</button>
            </div>
        </div>
    </div>
</div>
<!-- Every page needs these after the footer -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</th:block>
</body>
</html>
