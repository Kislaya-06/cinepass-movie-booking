<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Booking Confirmed - CinePass')}"></head>
<body class="d-flex flex-column min-vh-100">

    <!-- Shared Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4 py-lg-5">
        <div class="container-xl" style="max-width: 720px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-circle-check text-success fs-1 mb-2" aria-hidden="true"></i>
                <h1 class="fs-3 mb-1">Booking confirmed</h1>
                <p class="text-body-secondary mb-0">Your ticket is ready. We have also emailed it to you.</p>
            </div>

            <div class="ticket-card d-flex flex-column flex-sm-row mb-4">
                <div class="ticket-details flex-grow-1">
                    <h2 class="fs-5 mb-1" th:text="${reservation.showtime.movie.title}">Movie title</h2>
                    <div class="text-body-secondary small mb-3"
                         th:text="${reservation.showtime.screen.theater.name} + ' · Screen ' + ${reservation.showtime.screen.screenNumber}">Theater · Screen 1</div>
                    <div class="row g-3 small">
                        <div class="col-12">
                            <div class="text-body-secondary">Show</div>
                            <div class="fw-semibold" th:text="${#temporals.format(reservation.showtime.startTime, 'EEE, dd MMM yyyy · hh:mm a')}">Wed, 25 Nov 2026 · 06:49 PM</div>
                        </div>
                        <div class="col-6">
                            <div class="text-body-secondary">Seats</div>
                            <div class="fw-semibold" th:text="${reservation.seatSummary}">A1</div>
                        </div>
                        <div class="col-6">
                            <div class="text-body-secondary">Paid</div>
                            <div class="fw-semibold" th:text="'₹' + ${#numbers.formatDecimal(reservation.totalAmount, 1, 'COMMA', 2, 'POINT')}">₹450.00</div>
                        </div>
                    </div>
                </div>
                <div class="ticket-qr-section text-center" style="min-width: 170px;">
                    <img th:src="@{'/reservations/' + ${reservation.id} + '/qr.png'}" alt="Entry QR code for this booking" width="128" height="128" class="mb-2">
                    <div class="text-body-secondary small">Booking ID</div>
                    <div class="fw-mono fw-bold fs-6" th:text="${reservation.bookingReference}">CP-928410</div>
                    <div class="text-body-secondary small mt-1">Show this QR at the cinema entry</div>
                </div>
            </div>

            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a th:href="@{'/reservations/' + ${reservation.id} + '/ticket'}" class="btn btn-accent px-4">Download ticket (PDF)</a>
                <a th:href="@{/my-bookings}" class="btn btn-outline-custom px-4">My bookings</a>
            </div>
        </div>
    </main>

    <!-- Shared Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
