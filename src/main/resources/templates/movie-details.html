<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Movie Details - CinePass')}"></head>
<body>

    <!-- Shared Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1">
        <!-- Film header -->
        <section class="movie-banner-backdrop py-4 py-lg-5" th:style="${movie.posterUrl != null} ? '--banner-img: url(' + ${movie.posterUrl} + ')' : null">
            <div class="container-xl">
                <div class="row align-items-center g-4">
                    <div class="col-5 col-sm-4 col-lg-3">
                        <div class="detail-poster-wrap">
                            <img th:src="${movie.posterUrl}" th:alt="${movie.title} + ' poster'"
                                 onerror="this.src='https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop'">
                        </div>
                    </div>
                    <div class="col-12 col-sm-8 col-lg-9">
                        <h1 class="display-6 mb-3" th:text="${movie.title}">Movie title</h1>
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <span class="movie-meta-tag" th:if="${movie.rating != null}">
                                <i class="fa-solid fa-star text-gold" aria-hidden="true"></i><span th:text="${#numbers.formatDecimal(movie.rating, 1, 1)} + '/10'">8.0/10</span>
                            </span>
                            <span class="movie-meta-tag" th:text="${movie.language}">English</span>
                            <span class="movie-meta-tag" th:if="${movie.durationInMinutes != null}" th:text="${movie.durationInMinutes / 60} + 'h ' + ${movie.durationInMinutes % 60} + 'm'">2h 30m</span>
                            <span class="movie-meta-tag" th:text="${movie.genre}">Genre</span>
                            <span class="movie-meta-tag" th:if="${movie.releaseDate != null}" th:text="${#temporals.format(movie.releaseDate, 'dd MMM yyyy')}">01 Mar 2026</span>
                        </div>
                        <a th:if="${hasShows}" th:href="@{'/movies/' + ${movie.id} + '/buytickets'}" class="btn btn-accent btn-lg px-5">Book tickets</a>
                        <div th:unless="${hasShows}">
                            <span class="btn btn-light btn-lg px-5 disabled" aria-disabled="true" th:text="${comingSoon} ? 'Releasing ' + ${#temporals.format(movie.releaseDate, 'dd MMM yyyy')} : 'No shows in ' + ${selectedCity}">No shows</span>
                            <button type="button" class="btn btn-link text-white" th:if="${!comingSoon}" data-bs-toggle="modal" data-bs-target="#citySelectModal">Change city</button>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mt-3">
                            <button type="button" class="btn btn-glass btn-sm" th:if="${movie.trailerKey != null}"
                                    data-bs-toggle="modal" data-bs-target="#trailerModal">
                                <i class="fa-solid fa-play me-1" aria-hidden="true"></i> Watch trailer
                            </button>
                            <!-- No trailer from TMDb: fall back to a YouTube search -->
                            <a class="btn btn-glass btn-sm" target="_blank" rel="noopener" th:unless="${movie.trailerKey != null}"
                               th:href="${'https://www.youtube.com/results?search_query=' + #uris.escapeQueryParam(movie.title + ' official trailer')}">
                                <i class="fa-solid fa-play me-1" aria-hidden="true"></i> Watch trailer
                            </a>
                            <button type="button" class="btn btn-glass btn-sm" data-share th:data-share-title="${movie.title} + ' on CinePass'">
                                <i class="fa-solid fa-share-nodes me-1" aria-hidden="true"></i> <span>Share</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="container-xl py-4 py-lg-5">
            <section class="mb-5" style="max-width: 760px;">
                <h2 class="section-title fs-4 mb-2">About the movie</h2>
                <p class="text-body-secondary mb-0" th:text="${movie.description}">Description</p>
            </section>

            <section class="mb-5" th:unless="${movie.cast.isEmpty()}">
                <h2 class="section-title fs-4 mb-3">Cast</h2>
                <div class="people-row">
                    <div class="person" th:each="p : ${movie.cast}">
                        <img th:if="${p.photoUrl != null}" th:src="${p.photoUrl}" alt="" class="person-photo" loading="lazy">
                        <span th:unless="${p.photoUrl != null}" class="person-photo person-photo-empty" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
                        <div class="person-name" th:text="${p.name}">Name</div>
                        <div class="person-role" th:text="${p.role}">Role</div>
                    </div>
                </div>
            </section>

            <section class="mb-5" th:unless="${movie.crew.isEmpty()}">
                <h2 class="section-title fs-4 mb-3">Crew</h2>
                <div class="people-row">
                    <div class="person" th:each="p : ${movie.crew}">
                        <img th:if="${p.photoUrl != null}" th:src="${p.photoUrl}" alt="" class="person-photo" loading="lazy">
                        <span th:unless="${p.photoUrl != null}" class="person-photo person-photo-empty" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
                        <div class="person-name" th:text="${p.name}">Name</div>
                        <div class="person-role" th:text="${p.role}">Role</div>
                    </div>
                </div>
            </section>

            <section th:unless="${similarMovies.isEmpty()}">
                <div class="section-header">
                    <h2 class="section-title fs-4">You might also like</h2>
                </div>
                <div class="movie-scroll-row">
                    <div class="movie-card" th:each="m : ${similarMovies}">
                        <a th:href="@{'/movies/' + ${m.id}}">
                            <div class="movie-poster-wrap">
                                <img th:src="${m.posterUrl}" th:alt="${m.title} + ' poster'" class="movie-poster-img" loading="lazy"
                                     onerror="this.src='https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop'">
                                <div class="movie-rating-badge" th:if="${m.rating != null}">
                                    <i class="fa-solid fa-star text-gold me-1" aria-hidden="true"></i><span th:text="${#numbers.formatDecimal(m.rating, 1, 1)} + '/10'">8.0/10</span>
                                </div>
                            </div>
                            <div class="movie-card-body">
                                <div class="movie-title" th:text="${m.title}" th:title="${m.title}">Movie title</div>
                                <div class="movie-genres" th:text="${m.language != null ? m.language + ' · ' + m.genre : m.genre}">English · Genre</div>
                            </div>
                        </a>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Trailer: the iframe gets its src only while open (main.js), so nothing loads or plays in the background -->
    <div class="modal fade" id="trailerModal" tabindex="-1" th:if="${movie.trailerKey != null}" th:aria-label="${movie.title} + ' trailer'" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-black border-0">
                <button type="button" class="btn-close btn-close-white trailer-close" data-bs-dismiss="modal" aria-label="Close trailer"></button>
                <div class="ratio ratio-16x9">
                    <iframe th:data-src="'https://www.youtube-nocookie.com/embed/' + ${movie.trailerKey} + '?autoplay=1&rel=0'" th:title="${movie.title} + ' trailer'"
                            allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Shared Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
